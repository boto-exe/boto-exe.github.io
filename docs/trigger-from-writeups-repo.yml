# Put this file at .github/workflows/notify-site.yml inside HTBWriteUps and HackSmarterLabs_WriteUps.
# It rebuilds the site whenever you push a writeup.
# Needs a secret SITE_DISPATCH_PAT in that repo: a fine-grained token with
# Contents read and write on the site repo (repository_dispatch needs write).
name: Notify site
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/boto-exe/SITE_REPO_NAME/dispatches \
            -d '{"event_type":"writeups-updated"}'
